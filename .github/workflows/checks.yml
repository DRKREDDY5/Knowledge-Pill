name: Check project
on:
  push:
    paths-ignore:
      - 'editions/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-data.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check dist/app.js
      - run: node --check dist/daily-view.mjs
